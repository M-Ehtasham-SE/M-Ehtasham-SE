<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <clipPath id="lc"><circle cx="95" cy="75" r="46"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text{font-family:'Fira Code',SFMono-Regular,Consolas,Menlo,monospace}
    .ring{transform-origin:95px 75px;animation:s 12s linear infinite} @keyframes s{to{transform:rotate(360deg)}}
    .bar{animation:w 4s ease-in-out infinite} @keyframes w{0%,100%{width:200px}50%{width:300px}}
  </style>
  <rect width="900" height="150" rx="14" fill="#0b0f19"/>
  <rect x=".5" y=".5" width="899" height="149" rx="14" fill="none" stroke="url(#g)" stroke-opacity=".6"/>
  <g class="ring" filter="url(#glow)"><circle cx="95" cy="75" r="56" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="70 30"/></g>
  <circle cx="95" cy="75" r="48" fill="#fff"/>
  <image href="data:image/png;base64,{{LOGO}}" x="49" y="29" width="92" height="92" clip-path="url(#lc)"/>
  <text x="180" y="52" font-size="12" fill="#22d3ee">EDUCATION</text>
  <text x="180" y="82" font-size="22" font-weight="700" fill="#e5e7eb">FAST-NUCES</text>
  <text x="180" y="106" font-size="14" fill="#9ca3af">National University of Computer &amp; Emerging Sciences</text>
  <text x="180" y="128" font-size="14" fill="#a78bfa">B.S. Software Engineering · 3rd Year</text>
  <rect x="600" y="70" width="240" height="2" fill="#1f2937"/>
  <rect class="bar" x="600" y="70" height="2" fill="url(#g)" width="200"/>
  <text x="600" y="58" font-size="11" fill="#6b7280">// currently in progress</text>
