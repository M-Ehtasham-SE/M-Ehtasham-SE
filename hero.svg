<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#6366f1" stop-opacity="0.4"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="face"><circle cx="450" cy="150" r="78"/></clipPath>
    <clipPath id="c"><rect width="900" height="420" rx="16"/></clipPath>
    <g id="cube">
      <polygon points="0,-20 20,-10 0,0 -20,-10" fill="#22d3ee" fill-opacity="0.6"/>
      <polygon points="-20,-10 0,0 0,22 -20,12" fill="#6366f1" fill-opacity="0.5"/>
      <polygon points="20,-10 0,0 0,22 20,12" fill="#a78bfa" fill-opacity="0.5"/>
    </g>
  </defs>
  <style>
    text{font-family:'Fira Code',SFMono-Regular,Consolas,Menlo,monospace}
    .f1{animation:f 5s ease-in-out infinite} .f2{animation:f 6.5s ease-in-out infinite reverse} .f3{animation:f 7.5s ease-in-out infinite}
    @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .r1{transform-origin:450px 150px;animation:spin 14s linear infinite}
    .r2{transform-origin:450px 150px;animation:spin 22s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:p 3s ease-in-out infinite;transform-origin:450px 150px}
    @keyframes p{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
    .scan{animation:s 7s linear infinite} @keyframes s{0%{transform:translateX(-60px)}100%{transform:translateX(960px)}}
    .grid{animation:gd 3s linear infinite} @keyframes gd{from{transform:translateY(0)}to{transform:translateY(20px)}}
    .cur{animation:b 1s steps(1) infinite} @keyframes b{50%{opacity:0}}
  </style>
  <g clip-path="url(#c)">
    <rect width="900" height="420" fill="#0b0f19"/>
    <rect y="260" width="900" height="160" fill="url(#fade)"/>
    <!-- perspective floor -->
    <g stroke="#22d3ee" stroke-opacity="0.3">
      <g class="grid"><line x1="0" y1="262" x2="900" y2="262"/><line x1="0" y1="276" x2="900" y2="276"/><line x1="0" y1="296" x2="900" y2="296"/><line x1="0" y1="324" x2="900" y2="324"/><line x1="0" y1="362" x2="900" y2="362"/><line x1="0" y1="412" x2="900" y2="412"/></g>
      <line x1="450" y1="262" x2="450" y2="420"/>
      <line x1="450" y1="262" x2="330" y2="420"/><line x1="450" y1="262" x2="210" y2="420"/><line x1="450" y1="262" x2="90" y2="420"/><line x1="450" y1="262" x2="-40" y2="420"/>
      <line x1="450" y1="262" x2="570" y2="420"/><line x1="450" y1="262" x2="690" y2="420"/><line x1="450" y1="262" x2="810" y2="420"/><line x1="450" y1="262" x2="940" y2="420"/>
    </g>
    <g class="scan"><rect width="2" height="420" fill="#22d3ee" opacity="0.5" filter="url(#glow)"/></g>
    <!-- floating cubes -->
    <g class="f1"><use href="#cube" x="120" y="120"/></g>
    <g class="f2"><use href="#cube" x="210" y="205" transform="translate(70 60) scale(.7)"/></g>
    <g class="f3"><use href="#cube" x="780" y="130"/></g>
    <g class="f1"><use href="#cube" x="700" y="200" transform="translate(280 80) scale(.6)"/></g>
    <!-- portrait with orbit rings -->
    <circle class="pulse" cx="450" cy="150" r="125" fill="url(#aura)"/>
    <g class="r1" filter="url(#glow)"><circle cx="450" cy="150" r="100" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-dasharray="90 40 20 40"/></g>
    <g class="r2"><circle cx="450" cy="150" r="112" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1" stroke-dasharray="4 10"/><circle cx="450" cy="38" r="5" fill="#22d3ee" filter="url(#glow)"/></g>
    <circle cx="450" cy="150" r="82" fill="#0b0f19"/>
    <image href="data:image/jpeg;base64,{{PHOTO}}" x="372" y="72" width="156" height="156" clip-path="url(#face)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="450" cy="150" r="78" fill="none" stroke="url(#g)" stroke-width="2"/>
    <text x="450" y="282" text-anchor="middle" font-size="12" fill="#6b7280">~/ehtasham $ whoami</text>
    <text x="450" y="322" text-anchor="middle" font-size="34" font-weight="700" fill="url(#g)" filter="url(#glow)">MUHAMMAD EHTASHAM</text>
    <text x="450" y="352" text-anchor="middle" font-size="14" fill="#e5e7eb">Software Engineer in the making · Backend · Full-Stack · AI Integration</text>
    <text x="450" y="392" text-anchor="middle" font-size="12" fill="#9ca3af">Building intelligent software and turning ideas into real products<tspan class="cur" fill="#22d3ee"> █</tspan></text>
  </g>
  <rect x=".5" y=".5" width="899" height="419" rx="16" fill="none" stroke="url(#g)" stroke-opacity=".7"/>
</svg>