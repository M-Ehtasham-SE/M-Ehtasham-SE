<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <style>
    .w1{animation:m 9s linear infinite}
    .w2{animation:m 14s linear infinite reverse}
    @keyframes m{from{transform:translateX(0)}to{transform:translateX(-300px)}}
    text{font-family:'Fira Code',SFMono-Regular,Consolas,monospace}
  </style>
  <rect width="900" height="120" fill="#0b0f19" rx="12"/>
  <g class="w1" fill="none" stroke="url(#g)" stroke-opacity="0.5" stroke-width="2">
    <path d="M-300 85 q75 -30 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0"/>
  </g>
  <g class="w2" fill="none" stroke="url(#g)" stroke-opacity="0.25" stroke-width="2">
    <path d="M-300 95 q75 -24 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0"/>
  </g>
  <text x="450" y="52" text-anchor="middle" font-size="18" fill="#e5e7eb">Thanks for visiting my profile.</text>
</svg>
