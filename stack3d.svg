<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="slab">
      <polygon points="0,-40 140,-5 0,30 -140,-5" fill-opacity=".85"/>
      <polygon points="-140,-5 0,30 0,48 -140,13" fill="#000" fill-opacity=".35"/>
      <polygon points="140,-5 0,30 0,48 140,13" fill="#000" fill-opacity=".6"/>
    </g>
  </defs>
  <style>
    text{font-family:'Fira Code',SFMono-Regular,Consolas,Menlo,monospace}
    .s1{animation:h 5s ease-in-out infinite} .s2{animation:h 5s ease-in-out .4s infinite} .s3{animation:h 5s ease-in-out .8s infinite} .s4{animation:h 5s ease-in-out 1.2s infinite} .s5{animation:h 5s ease-in-out 1.6s infinite}
    @keyframes h{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .dash{stroke-dasharray:4 6;animation:d 2s linear infinite} @keyframes d{to{stroke-dashoffset:-20}}
  </style>
  <rect width="900" height="400" rx="14" fill="#0b0f19"/>
  <rect x=".5" y=".5" width="899" height="399" rx="14" fill="none" stroke="url(#g)" stroke-opacity=".5"/>
  <text x="30" y="40" font-size="12" fill="#22d3ee">// architecture, top to bottom</text>
  <!-- slabs, bottom to top -->
  <g class="s5"><use href="#slab" x="300" y="340" fill="#0ea5e9"/></g>
  <g class="s4"><use href="#slab" x="300" y="280" fill="#6366f1"/></g>
  <g class="s3"><use href="#slab" x="300" y="220" fill="#22d3ee"/></g>
  <g class="s2"><use href="#slab" x="300" y="160" fill="#8b5cf6"/></g>
  <g class="s1"><use href="#slab" x="300" y="100" fill="#a78bfa"/></g>
  <g stroke="#6b7280" fill="none" class="dash">
    <line x1="450" y1="105" x2="560" y2="105"/><line x1="450" y1="165" x2="560" y2="165"/><line x1="450" y1="225" x2="560" y2="225"/><line x1="450" y1="285" x2="560" y2="285"/><line x1="450" y1="345" x2="560" y2="345"/>
  </g>
  <g font-size="13">
    <text x="570" y="96" fill="#a78bfa" font-weight="700">AI</text><text x="570" y="114" fill="#9ca3af">OpenAI · Gemini · LangChain</text>
    <text x="570" y="156" fill="#a78bfa" font-weight="700">FRONTEND</text><text x="570" y="174" fill="#9ca3af">React · Tailwind CSS · JavaScript · TypeScript</text>
    <text x="570" y="216" fill="#22d3ee" font-weight="700">BACKEND</text><text x="570" y="234" fill="#9ca3af">Java · Spring Boot · Spring Security · Hibernate</text>
    <text x="570" y="276" fill="#818cf8" font-weight="700">DATA</text><text x="570" y="294" fill="#9ca3af">PostgreSQL · MySQL</text>
    <text x="570" y="336" fill="#38bdf8" font-weight="700">INFRA</text><text x="570" y="354" fill="#9ca3af">AWS · Docker · Linux · Git</text>
  </g>
</svg>
